<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoner | Matchmaking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }

        :root {
            --bg-color: #0d0c1d; /* Midnight Purple */
            --card-bg: rgba(30, 28, 50, 0.8);
            --cyan: #00e5ff; /* From the logo */
            --text-main: #ffffff;
            --text-sub: #8b8b9f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #1a183a 0%, var(--bg-color) 80%);
        }

        /* Top Navigation */
        .top-nav {
            height: 70px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(13, 12, 29, 0.9); backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo-small {
            font-size: 24px; font-weight: 900; color: var(--cyan); letter-spacing: -1px;
        }
        .logo-small span { color: white; }

        .profile-icon {
            width: 40px; height: 40px; border-radius: 50%; background: #222;
            border: 2px solid var(--cyan); display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 14px;
        }

        /* Main Content */
        .main-content {
            flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
        }

        .header-title { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .header-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 10px; }

        /* Matchmaking Card */
        .match-card {
            background: var(--card-bg); border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 20px; padding: 25px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 12px; color: var(--cyan); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-group select {
            padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); color: white;
            font-size: 16px; outline: none; appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300e5ff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto;
        }
        .input-group select:focus { border-color: var(--cyan); }

        .find-btn {
            width: 100%; padding: 18px; margin-top: 10px;
            background: var(--cyan); color: #000; font-size: 18px; font-weight: 900;
            border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 229, 255, 0.3); transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .find-btn:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(0, 229, 255, 0.5); }

        /* Bottom Nav */
        .bottom-nav {
            height: 70px; background: rgba(13, 12, 29, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around;
            align-items: center; z-index: 10;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-sub); font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--cyan); }
        .nav-icon { font-size: 20px; }

        /* Modal */
        #match-modal {
            position: absolute; top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        #match-modal.active { display: flex; }
        .modal-box { background: #1a183a; border: 1px solid var(--cyan); border-radius: 20px; padding: 30px; width: 80%; text-align: center; }
        .modal-box h2 { color: var(--cyan); font-size: 24px; margin-bottom: 15px; }
        .modal-box p { font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.5; }
        .modal-box button { padding: 15px; width: 100%; background: var(--cyan); color: #000; font-weight: bold; border: none; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .modal-box button.close { background: transparent; color: white; border: 1px solid #555; }

    </style>
</head>
<body>

    <!-- Top Nav -->
    <div class="top-nav">
        <div class="logo-small">Z<span>ONER</span></div>
        <div class="profile-icon">P1</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div>
            <h1 class="header-title">Find a Match</h1>
            <p class="header-sub">Queue up and find players on your level.</p>
        </div>

        <div class="match-card">
            <div class="input-group">
                <label>Region</label>
                <select id="region">
                    <option>North America (NA)</option>
                    <option>Europe (EU)</option>
                    <option>India (IN)</option>
                    <option>Brazil (BR)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Game Mode</label>
                <select id="game-mode">
                    <option>1v1 (Clash Squad)</option>
                    <option>4v4 (Clash Squad)</option>
                    <option>Full Squad (Battle Royale)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Rank</label>
                <select id="rank">
                    <option>Heroic</option>
                    <option>Grandmaster</option>
                    <option>Master</option>
                    <option>Diamond</option>
                </select>
            </div>

            <button class="find-btn" onclick="findMatch()">FIND MATCH</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🎯</span>
            <span>Match</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📊</span>
            <span>Stats</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👥</span>
            <span>Team</span>
        </div>
    </div>

    <!-- Match Found Modal -->
    <div id="match-modal">
        <div class="modal-box">
            <h2>Match Found!</h2>
            <p>Copy your match code and share it with your opponent or team.</p>
            <button onclick="copyCode()">Copy Match Code</button>
            <button class="close" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Modal Logic
        function findMatch() {
            document.getElementById('match-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('match-modal').classList.remove('active');
        }

        function copyCode() {
            const region = document.getElementById('region').value;
            const mode = document.getElementById('game-mode').value;
            const rank = document.getElementById('rank').value;
            
            // Create a formatted message based on the user's selection
            const matchMessage = `Looking for a ${mode} match in ${region}. Rank: ${rank}. Send me your ID!`;

            // Copy to clipboard
            navigator.clipboard.writeText(matchMessage).then(() => {
                alert("Match code copied to clipboard! Paste it in Discord or TikTok.");
                closeModal();
            }).catch(err => {
                alert("Failed to copy. Please try again.");
            });
        }
    </script>
</body>
</html>
