<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoop Dreamz: Chromebook Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            margin: 0; padding: 0; overflow: hidden; background: #111;
            font-family: 'Inter', sans-serif; color: white;
        }
        canvas { display: block; background: #1a1a2e; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .hud-box {
            background: rgba(0,0,0,0.6); padding: 15px 25px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            font-size: 24px; font-weight: 900;
        }
        #score { color: #00ffcc; }
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px;
            font-size: 14px; color: #aaa; pointer-events: none;
        }
        kbd {
            background: #333; padding: 3px 8px; border-radius: 4px;
            color: white; font-weight: bold; font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-box">SCORE: <span id="score">0</span></div>
        <div class="hud-box" style="color:#ffd700;">TIME: <span id="time">60</span>s</div>
    </div>

    <div id="controls">
        <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to Move | <kbd>Space</kbd> to Shoot
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game State
        let score = 0;
        let timeLeft = 60;
        let gameActive = true;

        // The Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            radius: 20,
            speed: 6,
            color: '#00ffcc', // Cyan player
            hasBall: true
        };

        // The Ball
        const ball = {
            x: player.x,
            y: player.y,
            radius: 10,
            color: '#ff6600',
            isShot: false,
            vx: 0,
            vy: 0,
            targetY: 100 // Where the hoop is
        };

        // The Hoop
        const hoop = {
            x: canvas.width / 2 - 40,
            y: 100,
            width: 80,
            height: 10,
            color: '#ff3333'
        };

        // Defenders (NPCs)
        let defenders = [
            { x: canvas.width / 2 - 150, y: canvas.height / 2, radius: 22, speed: 3, color: '#ff0033' },
            { x: canvas.width / 2 + 150, y: canvas.height / 2, radius: 22, speed: 4, color: '#ff0033' }
        ];

        // Keyboard Input Tracking
        const keys = { w: false, a: false, s: false, d: false, space: false };
        
        window.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'W') keys.w = true;
            if(e.key === 'a' || e.key === 'A') keys.a = true;
            if(e.key === 's' || e.key === 'S') keys.s = true;
            if(e.key === 'd' || e.key === 'D') keys.d = true;
            if(e.key === ' ') keys.space = true;
        });

        window.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.key === 'W') keys.w = false;
            if(e.key === 'a' || e.key === 'A') keys.a = false;
            if(e.key === 's' || e.key === 'S') keys.s = false;
            if(e.key === 'd' || e.key === 'D') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        // Shoot the Ball
        function shootBall() {
            if (!player.hasBall || ball.isShot) return;
            player.hasBall = false;
            ball.isShot = true;
            
            // Calculate trajectory towards hoop center
            const hoopCenterX = hoop.x + hoop.width / 2;
            ball.vx = (hoopCenterX - player.x) * 0.04;
            ball.vy = -25; // Shoot upward
        }

        // Reset after a shot
        function resetBall() {
            ball.isShot = false;
            player.hasBall = true;
            ball.x = player.x;
            ball.y = player.y - 20;
        }

        function update() {
            if (!gameActive) return;

            // Player Movement
            if (keys.w) player.y -= player.speed;
            if (keys.s) player.y += player.speed;
            if (keys.a) player.x -= player.speed;
            if (keys.d) player.x += player.speed;

            // Keep player on screen
            if (player.x < 30) player.x = 30;
            if (player.x > canvas.width - 30) player.x = canvas.width - 30;
            if (player.y > canvas.height - 30) player.y = canvas.height - 30;
            if (player.y < canvas.height / 2) player.y = canvas.height / 2; // Don't go past half court

            // Update Ball Position (if held)
            if (player.hasBall) {
                ball.x = player.x;
                ball.y = player.y - 20;
            }

            // Ball Physics (if shot)
            if (ball.isShot) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += 0.5; // Gravity

                // Collision with Hoop (Rim)
                if (ball.y > hoop.y && ball.y < hoop.y + 20 && ball.x > hoop.x && ball.x < hoop.x + hoop.width) {
                    if (ball.vy > 0) {
                        score += 2;
                        document.getElementById('score').innerText = score;
                        resetBall();
                    }
                }

                // If ball misses (goes below screen)
                if (ball.y > canvas.height) {
                    resetBall();
                }
            }

            // Shoot logic
            if (keys.space && player.hasBall) {
                shootBall();
            }

            // Defender AI (Chase the player)
            defenders.forEach(def => {
                let dx = player.x - def.x;
                let dy = player.y - def.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    def.x += (dx / dist) * def.speed;
                    def.y += (dy / dist) * def.speed;
                }

                // If defender touches player, steal the ball
                if (dist < player.radius + def.radius && player.hasBall) {
                    player.hasBall = false;
                    // Deflect ball away
                    ball.isShot = true;
                    ball.vx = (Math.random() - 0.5) * 20;
                    ball.vy = (Math.random() - 0.5) * 20 - 10; 
                    
                    // Flash red
                    document.body.style.background = '#ff0000';
                    setTimeout(() => document.body.style.background = '#111', 100);
                }
            });

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Court
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            // 3-Point Line
            ctx.beginPath();
            ctx.arc(canvas.width / 2, hoop.y + 30, 250, 0, Math.PI);
            ctx.stroke();

            // Draw Hoop
            ctx.fillStyle = hoop.color;
            ctx.fillRect(hoop.x, hoop.y, hoop.width, hoop.height);
            // Backboard
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(hoop.x + hoop.width, hoop.y - 40, 10, 80);

            // Draw Defenders
            defenders.forEach(def => {
                ctx.beginPath();
                ctx.arc(def.x, def.y, def.radius, 0, Math.PI * 2);
                ctx.fillStyle = def.color;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Draw jersey number
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('D', def.x, def.y + 6);
            });

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw jersey number
            ctx.fillStyle = 'black';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('1', player.x, player.y + 6);

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Timer
        setInterval(() => {
            if (gameActive) {
                timeLeft--;
                document.getElementById('time').innerText = timeLeft;
                if (timeLeft <= 0) gameActive = false;
            }
        }, 1000);

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        update();
    </script>
</body>
</html>
