<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Audio | Premium Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #000; color: #fff; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #000000 80%);
        }

        /* The Canvas that draws the audio bars */
        #visualizer-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* The Premium UI Overlay */
        .app-container {
            position: relative; z-index: 10;
            width: 90%; max-width: 1000px; height: 85vh;
            background: rgba(20, 20, 30, 0.4); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        /* Top Bar (Search/Profile) */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 40px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #00ffcc; }
        
        /* The Album Art & Info Center */
        .center-display {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        .album-art {
            width: 220px; height: 220px; border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc, #0055ff);
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.3);
            margin-bottom: 30px; display: flex; justify-content: center; align-items: center;
            animation: spin 10s linear infinite; animation-play-state: paused; /* Pauses when music pauses */
        }
        .album-art.playing { animation-play-state: running; }

        /* The vinyl record look */
        .album-art::after {
            content: ''; width: 50px; height: 50px; background: #000; border-radius: 50%;
            border: 5px solid #111;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        p { color: #aaa; font-size: 16px; margin-bottom: 40px; }

        /* Upload Button */
        .upload-btn {
            background: #00ffcc; color: #000; padding: 15px 35px;
            border: none; border-radius: 30px; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,255,204,0.2);
        }
        .upload-btn:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0,255,204,0.4); }

        /* The bottom player controls */
        .player-bar {
            padding: 25px 40px; display: flex; align-items: center; gap: 20px;
            background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.05);
            border-radius: 0 0 24px 24px;
        }
        
        .play-btn {
            width: 50px; height: 50px; border-radius: 50%; background: #fff;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn::before {
            content: '▶'; font-size: 18px; color: #000; margin-left: 3px;
        }
        .play-btn.playing::before { content: '⏸'; margin-left: 0; }

        /* Progress Bar */
        .progress-container {
            flex: 1; display: flex; align-items: center; gap: 15px; font-size: 12px; color: #aaa;
        }
        .progress-bar {
            flex: 1; height: 6px; background: #333; border-radius: 3px; cursor: pointer; position: relative;
        }
        .progress-fill {
            height: 100%; width: 0%; background: #00ffcc; border-radius: 3px; transition: width 0.1s;
        }

        /* Hidden Audio Input */
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <!-- The Background Visualizer -->
    <canvas id="visualizer-canvas"></canvas>

    <!-- The Main App UI -->
    <div class="app-container">
        
        <div class="top-bar">
            <div class="logo">NEXUS AUDIO</div>
            <div>👤</div>
        </div>

        <div class="center-display">
            <div class="album-art" id="album-art"></div>
            <h1 id="track-title">No Track Loaded</h1>
            <p id="track-artist">Upload a song to visualize</p>
            
            <label for="audio-upload" class="upload-btn">UPLOAD AUDIO FILE</label>
            <input type="file" id="audio-upload" accept="audio/*">
        </div>

        <div class="player-bar">
            <div class="play-btn" id="play-btn" onclick="togglePlay()"></div>
            
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar" onclick="seek(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <script>
        // --- 1. SETUP CANVAS & AUDIO ENGINE ---
        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio-player');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let audioContext;
        let analyser;
        let dataArray;
        let source;

        // --- 2. INITIALIZE AUDIO API ---
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; // Quality of the bars
                
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }

        // --- 3. UPLOAD MUSIC ---
        const fileUpload = document.getElementById('audio-upload');
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            audio.src = fileURL;
            
            // Update UI
            document.getElementById('track-title').innerText = file.name.replace(/\.[^/.]+$/, ""); // Remove file extension
            document.getElementById('track-artist').innerText = "Local File";
            
            // Ready to play
            initAudio();
            audio.load();
        });

        // --- 4. PLAYER CONTROLS ---
        const playBtn = document.getElementById('play-btn');
        const albumArt = document.getElementById('album-art');

        function togglePlay() {
            if (!audio.src) return; // Nothing uploaded

            if (audio.paused) {
                audio.play();
                playBtn.classList.add('playing');
                albumArt.classList.add('playing');
                if(audioContext.state === 'suspended') audioContext.resume();
            } else {
                audio.pause();
                playBtn.classList.remove('playing');
                albumArt.classList.remove('playing');
            }
        }

        // Progress bar update
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progress-fill').style.width = `${percent}%`;
                
                // Update time text
                document.getElementById('current-time').innerText = formatTime(audio.currentTime);
                document.getElementById('duration').innerText = formatTime(audio.duration);
            }
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function seek(e) {
            if (!audio.duration) return;
            const bar = document.getElementById('progress-bar');
            const rect = bar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / bar.offsetWidth;
            audio.currentTime = pos * audio.duration;
        }

        // --- 5. THE VISUALIZER DRAW LOOP ---
        function draw() {
            requestAnimationFrame(draw);

            if (!analyser) return; // Wait until music is loaded

            analyser.getByteFrequencyData(dataArray);

            // Clear canvas with a slight fade effect for smooth trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const bufferLength = analyser.frequencyBinCount;
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = dataArray[i] * 1.5; // Scale the height

                // Gradient color (Cyan to Blue to Purple)
                const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
                gradient.addColorStop(0, 'rgba(0, 255, 204, 0.1)');
                gradient.addColorStop(0.5, 'rgba(0, 170, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(138, 43, 226, 1)');

                ctx.fillStyle = gradient;
                
                // Draw the bars from the bottom up
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + 2; // Spacing between bars
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start the draw loop
        draw();

    </script>
</body>
</html>
