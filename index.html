<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #0a0a0f; color: white;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0f 100%);
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 30, 0.8);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        p { color: #888; margin-bottom: 40px; font-size: 14px; }

        button {
            padding: 20px 60px;
            font-size: 20px;
            font-weight: 900;
            color: #000;
            background-color: #00ffcc;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.3);
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.5);
            background-color: #00e6b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PROXY PORTAL</h1>
        <p>Click the button to launch the invisible proxy.</p>
        <button onclick="launchPortal()">LAUNCH</button>
    </div>

    <script>
        function launchPortal() {
            // Open the blank tab
            let newTab = window.open('about:blank', '_blank');

            // I PUT THE XYLORA PROXY LINK HERE. 
            // You can change it to whatever proxy you are using if Xylora is down.
            let html = `
                <html>
                <head><title>Google Docs</title></head> <!-- Fake title to hide it -->
                <body style="margin:0; overflow:hidden; background:#000;">
                    <iframe src="https://xylora.dd-maison.net/" style="width:100vw; height:100vh; border:none;"></iframe>
                </body>
                </html>
            `;

            newTab.document.write(html);
            newTab.document.close();
        }
    </script>
</body>
</html>
