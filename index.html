<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #0a0a0f; color: white;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0f 100%);
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 30, 0.8);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 32px; margin-bottom: 10px;
            color: #00ffcc; text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        p { color: #888; margin-bottom: 40px; font-size: 14px; }

        button {
            padding: 20px 60px; font-size: 20px; font-weight: 900;
            color: #000; background-color: #00ffcc;
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.3);
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PROXY PORTAL</h1>
        <p>Click the button to launch the portal.</p>
        <button onclick="launchPortal()">LAUNCH</button>
    </div>

    <script>
        function launchPortal() {
            let newTab = window.open('about:blank', '_blank');

            // The proxy link
            let proxyUrl = "https://b.woodvilleweather.com"; 

            // The HTML for the blank tab
            let html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Google Docs</title>
                    <style>
                        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
                        iframe { width: 100%; height: 100%; border: none; }
                        
                        /* The Panic Screen CSS */
                        #panic-screen {
                            display: none; /* Hidden by default */
                            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
                            background-color: #f1f3f4; color: #333; z-index: 9999;
                            font-family: Arial, sans-serif; padding: 50px;
                        }
                        .doc-header { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
                        .doc-title { font-size: 24px; font-weight: normal; margin: 0; color: #1a73e8; }
                        .doc-content { font-size: 14px; line-height: 1.5; }
                    </style>
                </head>
                <body>
                    <!-- The actual proxy -->
                    <iframe id="proxy-frame" src="${proxyUrl}"></iframe>

                    <!-- The fake panic screen -->
                    <div id="panic-screen">
                        <div class="doc-header">
                            <h1 class="doc-title">English 10 - Final Essay</h1>
                        </div>
                        <div class="doc-content">
                            <p><strong>Prompt:</strong> Analyze the theme of isolation in Mary Shelley's Frankenstein.</p>
                            <p>Mary Shelley uses isolation as a catalyst for destruction in Frankenstein. Victor Frankenstein isolates himself in his pursuit of knowledge, while the Creature is isolated by society's fear of his appearance...</p>
                            <p><em>(You can type anything here in the code to make it look real)</em></p>
                        </div>
                    </div>

                    <script>
                        let isPanic = false;

                        // Listen for the Escape key
                        document.addEventListener('keydown', function(event) {
                            if (event.key === 'Escape') {
                                let panicScreen = document.getElementById('panic-screen');
                                let proxyFrame = document.getElementById('proxy-frame');
                                
                                if (!isPanic) {
                                    // Show panic screen, hide proxy
                                    panicScreen.style.display = 'block';
                                    proxyFrame.style.display = 'none';
                                    isPanic = true;
                                } else {
                                    // Hide panic screen, show proxy
                                    panicScreen.style.display = 'none';
                                    proxyFrame.style.display = 'block';
                                    isPanic = false;
                                }
                            }
                        });
                    </script>
                </body>
                </html>
            `;

            newTab.document.write(html);
            newTab.document.close();
        }
    </script>
</body>
</html>
