<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vanguard 3D | Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 6px #00ffcc; }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
        
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; font-weight: 800; text-shadow: 0 2px 5px black; font-size: 20px; }
        .weapon-name { color: #00ffcc; font-size: 14px; margin-top: 5px; font-weight: 600; letter-spacing: 1px; }
        
        #instructions { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: white; z-index: 10; text-align: center; background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 12px; border: 1px solid #00ffcc; backdrop-filter: blur(5px); }
        #instructions h3 { margin: 0 0 10px 0; color: #00ffcc; }
        
        #damage-flash { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.1s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="damage-flash"></div>
    
    <div id="ui">
        <div>HP: <span id="hp" style="color:#ff4444;">100</span></div>
        <div>KILLS: <span id="score" style="color:#00ffcc;">0</span></div>
        <div class="weapon-name">M4A1 TACTICAL</div>
    </div>

    <div id="instructions">
        <h3>CLICK TO DEPLOY</h3>
        <p style="margin: 5px 0; font-size: 14px;">WASD Move | Space Jump | Left Click Shoot</p>
    </div>

    <script>
        let scene, camera, renderer, weapon;
        let enemies = [];
        let score = 0, hp = 100;
        let moveForward, moveBackward, moveLeft, moveRight, canJump;
        let velocity = new THREE.Vector3();
        let prevTime = performance.now();
        let pitch = 0, yaw = 0;
        let canShoot = true;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 50, 200);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2.5;

            // Fast WebGL Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dir = new THREE.DirectionalLight(0xffffff, 0.5);
            dir.position.set(100, 200, 50);
            scene.add(dir);

            // Fast Flat Ground (No Heavy Textures)
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // CoD Style Cover Blocks
            const blockMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            for(let i=0; i<50; i++) {
                const w = Math.random()*10 + 4, h = Math.random()*15 + 4, d = Math.random()*10 + 4;
                const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), blockMat);
                block.position.set(Math.random()*200 - 100, h/2, Math.random()*200 - 100);
                scene.add(block);
            }

            // Weapon Build
            weapon = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.8), new THREE.MeshLambertMaterial({color: 0x223322}));
            body.position.set(0, 0, -0.2);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5), new THREE.MeshLambertMaterial({color: 0x111111}));
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, -0.7);
            const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2), new THREE.MeshLambertMaterial({color: 0x000000}));
            scope.rotation.x = Math.PI / 2; scope.position.set(0, 0.1, -0.2);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.2, 0.1), new THREE.MeshLambertMaterial({color: 0x333333}));
            mag.position.set(0, -0.12, -0.1);

            weapon.add(body); weapon.add(barrel); weapon.add(scope); weapon.add(mag);
            weapon.position.set(0.25, -0.25, -0.4);
            camera.add(weapon);
            scene.add(camera);

            for(let i=0; i<15; i++) spawnEnemy();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('pointerlockchange', onPLC);
            window.addEventListener('resize', onResize);

            animate();
        }

        function shoot() {
            if(!canShoot) return;
            canShoot = false;
            
            // Recoil
            pitch += 0.03; 
            weapon.position.z += 0.1;
            setTimeout(() => { weapon.position.z -= 0.1; }, 50);
            setTimeout(() => canShoot = true, 120);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const intersects = raycaster.intersectObjects(enemies);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                scene.remove(hit);
                enemies = enemies.filter(e => e !== hit);
                score += 1;
                document.getElementById('score').innerText = score;
                spawnEnemy();
            }
        }

        function onMouseDown(e) {
            if (document.pointerLockElement === document.body) {
                if (e.button === 0) shoot();
            } else {
                document.body.requestPointerLock();
            }
        }

        function onMouseMove(e) {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        }

        function onKeyDown(e) {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) { velocity.y += 12; canJump = false; } break;
            }
        }

        function onKeyUp(e) {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onPLC() {
            document.getElementById('instructions').style.display = document.pointerLockElement === document.body ? 'none' : 'block';
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function spawnEnemy() {
            const geo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
            const mat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
            const enemy = new THREE.Mesh(geo, mat);
            enemy.position.set(Math.random()*100 - 50, 1.1, Math.random()*100 - 50);
            enemy.userData = { speed: 0.04 };
            scene.add(enemy);
            enemies.push(enemy);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 2.0 * delta;

            const dirZ = Number(moveForward) - Number(moveBackward);
            const dirX = Number(moveRight) - Number(moveLeft);
            const dir = new THREE.Vector3(dirX, 0, dirZ).normalize();

            velocity.z -= dir.z * 50.0 * delta;
            velocity.x -= dir.x * 50.0 * delta;

            camera.position.x += velocity.x * delta;
            camera.position.z += velocity.z * delta;
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2.5) {
                velocity.y = 0; camera.position.y = 2.5; canJump = true;
            }

            // Recoil Recovery
            if (pitch > 0 && !document.pointerLockElement) pitch -= 0.01; 

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            weapon.position.y = -0.25 + Math.sin(time * 0.01) * 0.015 * (Math.abs(velocity.x) + Math.abs(velocity.z));

            enemies.forEach(enemy => {
                enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
                enemy.translateZ(enemy.userData.speed);
                
                if (enemy.position.distanceTo(camera.position) < 2) {
                    hp -= 1;
                    document.getElementById('hp').innerText = Math.floor(hp);
                    document.getElementById('damage-flash').style.opacity = 0.4;
                    setTimeout(() => document.getElementById('damage-flash').style.opacity = 0, 100);
                    if (hp <= 0) { alert("MISSION FAILED"); window.location.reload(); }
                }
            });

            renderer.render(scene, camera);
            prevTime = time;
        }

        init();
    </script>
</body>
</html>
