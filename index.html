<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0a0a0f;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0f 70%);
        }

        /* Top Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #00ffcc;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,255,204,0.4);
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            margin: 0 40px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(25, 25, 35, 0.8);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .clock {
            font-size: 18px;
            font-weight: 500;
            color: #8b8b9f;
        }

        /* Main Grid */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 20px;
            font-weight: 500;
            color: #8b8b9f;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 30px;
            max-width: 900px;
            width: 100%;
            justify-items: center;
        }

        /* App Icons */
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-icon:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #1c1c24, #2a2a35);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin-bottom: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .app-icon:hover .icon-box {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .app-name {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        /* Full Screen App Overlay */
        #iframe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0f;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        #iframe-overlay.active {
            display: flex;
        }

        .overlay-header {
            padding: 15px 20px;
            background: #1c1c24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .close-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #ff1a25;
        }

        #app-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* Loader */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-size: 18px;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">NEXUS OS</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search the web securely...">
        </div>
        <div class="clock" id="clock">00:00</div>
    </nav>

    <div class="main-content">
        <div class="section-title">Your Apps</div>
        <div class="app-grid" id="appGrid">
            <!-- Apps will be injected here by JS -->
        </div>
    </div>

    <!-- Fullscreen Iframe Overlay -->
    <div id="iframe-overlay">
        <div class="overlay-header">
            <div id="overlay-title" style="font-weight: bold; color: #00ffcc;">App</div>
            <button class="close-btn" onclick="closeApp()">Close App</button>
        </div>
        <div id="app-frame-container" style="flex: 1; position: relative;">
            <div class="loader" id="loader">Connecting to secure server...</div>
            <iframe id="app-frame" allow="fullscreen; autoplay; encrypted-media" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
    </div>

    <script>
        // 1. Clock Logic
        function updateClock() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. The App List
        // We are using 'api.allorigins.win' as a secure proxy to load pages inside the iframe.
        const apps = [
            { name: 'TikTok', icon: '🎵', url: 'https://www.tiktok.com' },
            { name: 'Movies', icon: '🍿', url: 'https://www.youtube.com/feed/trending' },
            { name: 'Games', icon: '🎮', url: 'https://poki.com' },
            { name: 'ChatGPT', icon: '🤖', url: 'https://chatgpt.com' },
            { name: 'Discord', icon: '👾', url: 'https://discord.com/app' },
            { name: 'Reddit', icon: '🛸', url: 'https://www.reddit.com' },
            { name: 'Twitch', icon: '🟣', url: 'https://www.twitch.tv' },
            { name: 'Spotify', icon: '🎧', url: 'https://open.spotify.com' }
        ];

        // 3. Render Apps to the Grid
        const appGrid = document.getElementById('appGrid');
        apps.forEach(app => {
            const appDiv = document.createElement('div');
            appDiv.className = 'app-icon';
            appDiv.innerHTML = `
                <div class="icon-box">${app.icon}</div>
                <div class="app-name">${app.name}</div>
            `;
            appDiv.onclick = () => openApp(app.name, app.url);
            appGrid.appendChild(appDiv);
        });

        // 4. Open App Logic (Using Proxy to bypass X-Frame-Options)
        const overlay = document.getElementById('iframe-overlay');
        const iframe = document.getElementById('app-frame');
        const overlayTitle = document.getElementById('overlay-title');
        const loader = document.getElementById('loader');

        function openApp(name, url) {
            overlay.classList.add('active');
            overlayTitle.innerText = name;
            loader.style.display = 'block';
            iframe.style.opacity = '0';
            
            // Using a public CORS proxy to fetch the site so the school can't block the iframe
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
            
            iframe.src = proxyUrl;
            
            // Simulate loading time for smooth UI
            setTimeout(() => {
                loader.style.display = 'none';
                iframe.style.opacity = '1';
            }, 1500);
        }

        function closeApp() {
            overlay.classList.remove('active');
            iframe.src = 'about:blank'; // Kill the app process
        }

        // 5. Search Logic (Redirects to Google via proxy)
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                let query = this.value.trim();
                if (query) {
                    const searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                    openApp('Search Results', searchUrl);
                    this.value = '';
                }
            }
        });
    </script>
</body>
</html>
