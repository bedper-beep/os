<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensi Lab | Pro Settings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }

        :root {
            --red-main: #ff0000;
            --red-dark: #990000;
            --bg-color: #050000;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
        }

        body {
            height: 100vh; width: 100vw; overflow: hidden; background-color: var(--bg-color);
            color: var(--text-main); display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        /* Animated Moving Background (Simulating a GIF/Vibe) */
        .bg-animation {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 0, 0.15) 0%, transparent 60%);
            animation: pulseBg 4s infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Optional: You can replace this div with an actual <img> tag of a GIF */
        .gif-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background-image: url('https://media.giphy.com/media/xTiTnDTaF9tVq3O0aY/giphy.gif'); /* Placeholder red gaming GIF */
            background-size: cover; background-position: center;
            opacity: 0.1; mix-blend-mode: screen;
        }

        /* Main App Container */
        .app-container {
            position: relative; z-index: 10;
            width: 100%; max-width: 800px; height: 100%;
            display: flex; flex-direction: column; padding: 40px 20px;
            overflow-y: auto;
        }

        /* Header */
        .header {
            text-align: center; margin-bottom: 40px;
            animation: slideDown 0.6s ease forwards;
        }

        .header h1 {
            font-size: 48px; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; color: #fff;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.4);
        }

        .header p {
            color: var(--red-main); font-weight: 600; letter-spacing: 5px; font-size: 14px;
            margin-top: 5px; text-transform: uppercase;
        }

        /* Profile Card */
        .profile-card {
            background: rgba(15, 0, 0, 0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 0, 0.3); border-radius: 20px;
            padding: 30px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(255, 0, 0, 0.1);
            animation: slideUp 0.6s ease 0.2s forwards; opacity: 0;
        }

        .profile-card img {
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid var(--red-main); padding: 5px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); margin-bottom: 15px;
        }

        .profile-card h2 { font-size: 28px; font-weight: 800; }
        .profile-card p { color: var(--text-sub); font-size: 14px; margin-top: 5px; }

        /* Sensitivity Grid */
        .sensi-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            animation: slideUp 0.6s ease 0.4s forwards; opacity: 0;
        }

        .sensi-card {
            background: rgba(20, 5, 5, 0.8); border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }

        .sensi-card:hover {
            border-color: var(--red-main); transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
        }

        .sensi-info h3 { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 5px; }
        .sensi-info p { font-size: 12px; color: var(--text-sub); }

        .sensi-value {
            font-size: 28px; font-weight: 900; color: var(--red-main);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* Copy Button */
        .copy-btn {
            width: 100%; padding: 18px; margin-top: 40px;
            background: var(--red-main); color: #fff;
            font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
            border: none; border-radius: 16px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
            transition: 0.3s; animation: slideUp 0.6s ease 0.6s forwards; opacity: 0;
        }

        .copy-btn:hover {
            background: #cc0000; transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 0, 0, 0.6);
        }

        /* Animations */
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--red-main); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="gif-overlay"></div>

    <div class="app-container">
        
        <div class="header">
            <h1>SENSI LAB</h1>
            <p>PRO LEVEL SETTINGS</p>
        </div>

        <div class="profile-card">
            <!-- Replace with your own TikTok profile picture link -->
            <img src="https://images.unsplash.com/photo-1614680376593-902f74cf0d41?q=80&w=200&auto=format&fit=crop" alt="Profile">
            <h2>KING BLUE RX</h2>
            <p>Free Fire Pro Settings 2024</p>
        </div>

        <div class="sensi-grid">
            <div class="sensi-card">
                <div class="sensi-info">
                    <h3>General</h3>
                    <p>Look around</p>
                </div>
                <div class="sensi-value">98</div>
            </div>

            <div class="sensi-card">
                <div class="sensi-info">
                    <h3>Red Dot</h3>
                    <p>Close range</p>
                </div>
                <div class="sensi-value">95</div>
            </div>

            <div class="sensi-card">
                <div class="sensi-info">
                    <h3>2x Scope</h3>
                    <p>Mid range</p>
                </div>
                <div class="sensi-value">85</div>
            </div>

            <div class="sensi-card">
                <div class="sensi-info">
                    <h3>4x Scope</h3>
                    <p>Long range</p>
                </div>
                <div class="sensi-value">75</div>
            </div>

            <div class="sensi-card">
                <div class="sensi-info">
                    <h3>AWM Scope</h3>
                    <p>Sniper</p>
                </div>
                <div class="sensi-value">60</div>
            </div>

            <div class="sensi-card">
                <div class="sensi-info">
                    <h3>Fire Button</h3>
                    <p>Size</p>
                </div>
                <div class="sensi-value">55</div>
            </div>
        </div>

        <button class="copy-btn" onclick="copySettings()">COPY SETTINGS</button>

    </div>

    <script>
        // Simple interactive button logic for now
        function copySettings() {
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.innerText;
            
            btn.innerText = "COPIED TO CLIPBOARD!";
            btn.style.background = "#00ff00"; // Flash green for success
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "var(--red-main)";
            }, 2000);
        }
    </script>
</body>
</html>
