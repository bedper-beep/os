<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostOS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        /* OS Background */
        body { background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Top Bar */
        .top-bar { height: 30px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; font-size: 13px; font-weight: 600; z-index: 1000; }
        .top-right { display: flex; gap: 15px; }
        
        /* Desktop Icons */
        .desktop { flex: 1; position: relative; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
        .icon { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; cursor: pointer; padding: 10px; border-radius: 8px; transition: 0.2s; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .icon:hover { background: rgba(255,255,255,0.2); }
        .icon i { font-size: 40px; margin-bottom: 8px; }
        .icon span { font-size: 12px; font-weight: 600; text-align: center; }
        
        /* Window Management */
        .window { position: absolute; top: 10%; left: 20%; width: 60%; height: 75%; background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: none; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .window.active { display: flex; }
        .window-header { height: 40px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .close-btn { width: 15px; height: 15px; background: #ff5f56; border-radius: 50%; cursor: pointer; border: none; }
        .window-content { flex: 1; background: #000; position: relative; }
        .window-content iframe { width: 100%; height: 100%; border: none; }

        /* Dock */
        .dock { height: 70px; background: rgba(20,20,25,0.8); backdrop-filter: blur(20px); margin: 0 auto 15px auto; border-radius: 20px; display: flex; align-items: center; padding: 0 20px; gap: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .dock-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; cursor: pointer; transition: 0.2s; }
        .dock-icon:hover { transform: scale(1.2) translateY(-5px); }
        .dock-icon.tiktok { background: #000; border: 1px solid #25f4ee; }
        .dock-icon.youtube { background: #ff0000; }
        .dock-icon.music { background: #1db954; }
        .dock-icon.movies { background: #ff9900; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div>👻 GhostOS</div>
        <div class="top-right" id="clock">12:00 PM</div>
    </div>

    <!-- Desktop Area -->
    <div class="desktop">
        <!-- Desktop Icons -->
        <div class="icon" onclick="openApp('tiktok')">
            <i class="fab fa-tiktok"></i>
            <span>TikTok</span>
        </div>
        <div class="icon" onclick="openApp('youtube')">
            <i class="fab fa-youtube" style="color: #ff0000;"></i>
            <span>YouTube</span>
        </div>
        <div class="icon" onclick="openApp('movies')">
            <i class="fas fa-film" style="color: #ff9900;"></i>
            <span>Movies</span>
        </div>
        <div class="icon" onclick="openApp('music')">
            <i class="fas fa-music" style="color: #1db954;"></i>
            <span>Music</span>
        </div>

        <!-- Windows -->
        <div class="window" id="window-tiktok">
            <div class="window-header">
                <span>TikTok (Proxied)</span>
                <button class="close-btn" onclick="closeApp('tiktok')"></button>
            </div>
            <div class="window-content">
                <!-- Using a different proxy to bypass Linewize -->
                <iframe src="https://translate.google.com/translate?sl=auto&tl=en&u=https://www.tiktok.com/foryou" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <div class="window" id="window-youtube">
            <div class="window-header">
                <span>YouTube (Invidious Stealth)</span>
                <button class="close-btn" onclick="closeApp('youtube')"></button>
            </div>
            <div class="window-content">
                <!-- Invidious is a YouTube frontend that bypasses school blocks -->
                <iframe src="https://inv.nadeko.net/" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <div class="window" id="window-movies">
            <div class="window-header">
                <span>Movies (VidSrc)</span>
                <button class="close-btn" onclick="closeApp('movies')"></button>
            </div>
            <div class="window-content">
                <iframe src="https://vidsrc.xyz/embed/movie/299534" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <div class="window" id="window-music">
            <div class="window-header">
                <span>Music</span>
                <button class="close-btn" onclick="closeApp('music')"></button>
            </div>
            <div class="window-content">
                <iframe src="https://www.youtube.com/embed/videoseries?list=PLw-VjHDlEOgvtnnnqWlTqByAtC7tXBg6D&autoplay=1" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
    </div>

    <!-- Bottom Dock -->
    <div class="dock">
        <div class="dock-icon tiktok" onclick="openApp('tiktok')"><i class="fab fa-tiktok"></i></div>
        <div class="dock-icon youtube" onclick="openApp('youtube')"><i class="fab fa-youtube"></i></div>
        <div class="dock-icon movies" onclick="openApp('movies')"><i class="fas fa-film"></i></div>
        <div class="dock-icon music" onclick="openApp('music')"><i class="fas fa-music"></i></div>
    </div>

    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function openApp(appName) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            const win = document.getElementById(`window-${appName}`);
            if(win) win.classList.add('active');
        }

        function closeApp(appName) {
            const win = document.getElementById(`window-${appName}`);
            if(win) win.classList.remove('active');
        }
    </script>
</body>
</html>
