<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostOS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.5s; }
        
        /* Top Bar */
        .top-bar { height: 35px; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; color: white; font-size: 13px; font-weight: 600; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .top-left { display: flex; gap: 15px; align-items: center; }
        .top-right { display: flex; gap: 15px; align-items: center; }
        
        /* Desktop Grid */
        .desktop { flex: 1; position: relative; padding: 30px; display: grid; grid-template-columns: repeat(auto-fill, 90px); grid-auto-rows: 100px; gap: 20px; align-content: flex-start; }
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; color: white; }
        .app-icon:hover .icon-box { transform: scale(1.05); }
        .icon-box { width: 65px; height: 65px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 8px; transition: 0.2s; }
        .app-icon span { font-size: 13px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center; }
        
        .bg-tiktok { background: #000; border: 1px solid #25f4ee; color: white; }
        .bg-youtube { background: #ff0000; color: white; }
        .bg-movies { background: #ff9900; color: white; }
        .bg-music { background: #1db954; color: white; }
        .bg-search { background: #0078D7; color: white; }
        .bg-ai { background: #8b5cf6; color: white; }
        .bg-games { background: #a970ff; color: white; }
        .bg-settings { background: #3f3f46; color: white; }

        /* Windows */
        .window { position: absolute; top: 10%; left: 15%; width: 70%; height: 75%; background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: none; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .window.active { display: flex; animation: openWin 0.2s ease-out; }
        @keyframes openWin { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .window-header { height: 40px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .window-controls { display: flex; gap: 10px; }
        .win-btn { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: none; }
        .btn-red { background: #ff5f56; } .btn-green { background: #27c93f; }
        .window-content { flex: 1; background: #000; position: relative; display: flex; flex-direction: column; }
        .window-content iframe { width: 100%; height: 100%; border: none; }

        /* Custom YouTube / TikTok Search App */
        .app-layout { display: flex; flex-direction: column; height: 100%; background: #0f0f0f; }
        .app-search-bar { padding: 15px; background: #181818; display: flex; gap: 10px; border-bottom: 1px solid #333; }
        .app-search-bar input { flex: 1; padding: 10px 20px; border-radius: 20px; border: 1px solid #333; background: #000; color: white; outline: none; }
        .app-search-bar button { padding: 10px 20px; border-radius: 20px; border: none; background: #ff0000; color: white; font-weight: bold; cursor: pointer; }
        
        .video-grid { flex: 1; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; overflow-y: auto; }
        .video-card { background: #1f1f1f; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .video-card:hover { transform: scale(1.02); }
        .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .video-card h4 { padding: 10px; font-size: 14px; color: white; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .video-player-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 10; }
        .video-player-overlay.active { display: flex; }
        .video-player-overlay iframe { flex: 1; width: 100%; border: none; }
        .close-player { padding: 10px; background: #ff0000; color: white; text-align: center; font-weight: bold; cursor: pointer; }

        /* Music App */
        .music-app { display: flex; flex-direction: column; height: 100%; background: #121212; padding: 20px; overflow-y: auto; }
        .music-header { display: flex; gap: 10px; margin-bottom: 20px; }
        .music-header input { flex: 1; padding: 12px; border-radius: 30px; border: none; background: #2a2a2a; color: white; outline: none; }
        .music-header button { padding: 12px 25px; border-radius: 30px; border: none; background: #1db954; color: black; font-weight: bold; cursor: pointer; }
        .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .music-card { background: #181818; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .music-card:hover { background: #282828; }
        .music-card img { width: 100%; aspect-ratio: 1; border-radius: 5px; margin-bottom: 10px; }
        .music-card h4 { font-size: 14px; color: white; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-card p { font-size: 12px; color: #b3b3b3; }

        /* AI, Games, Settings (Same as before) */
        .ai-app { display: flex; flex-direction: column; height: 100%; background: #121212; padding: 20px; }
        .ai-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .msg { padding: 12px 18px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.5; }
        .msg.user { background: #0078D7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.bot { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai-input { display: flex; gap: 10px; }
        .ai-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; outline: none; }
        .ai-input button { padding: 12px 20px; border-radius: 8px; border: none; background: #8b5cf6; color: white; font-weight: bold; cursor: pointer; }
        .settings-app { padding: 30px; background: #121212; height: 100%; color: white; }
        .bg-options { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .bg-opt { width: 180px; height: 100px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; background-size: cover; background-position: center; }
        .upload-btn { background: #0078D7; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .games-app { padding: 20px; background: #121212; height: 100%; overflow-y: auto; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .game-card { background: #1f1f23; border: 1px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; text-align: center; }
        .game-card img { width: 100%; height: 120px; object-fit: cover; }
        .game-card p { padding: 10px; font-weight: bold; font-size: 14px; }

        /* Floating Dock */
        .dock { height: 70px; background: rgba(30,30,35,0.7); backdrop-filter: blur(25px); margin: 0 auto 20px auto; border-radius: 24px; display: flex; align-items: center; padding: 0 25px; gap: 20px; border: 1px solid rgba(255,255,255,0.15); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dock-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; cursor: pointer; transition: 0.2s; }
        .dock-icon:hover { transform: scale(1.15) translateY(-8px); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-left">
            <i class="fas fa-bars icon-btn"></i>
            <span style="font-weight: 800;">GhostOS</span>
        </div>
        <div class="top-right">
            <i class="fas fa-battery-three-quarters icon-btn" style="color: #27c93f;"></i>
            <i class="fas fa-wifi icon-btn"></i>
            <span id="clock">12:00 PM</span>
        </div>
    </div>

    <div class="desktop">
        <div class="app-icon" onclick="openApp('tiktok')"><div class="icon-box bg-tiktok"><i class="fab fa-tiktok"></i></div><span>TikTok</span></div>
        <div class="app-icon" onclick="openApp('youtube')"><div class="icon-box bg-youtube"><i class="fab fa-youtube"></i></div><span>YouTube</span></div>
        <div class="app-icon" onclick="openApp('movies')"><div class="icon-box bg-movies"><i class="fas fa-film"></i></div><span>Movies</span></div>
        <div class="app-icon" onclick="openApp('music')"><div class="icon-box bg-music"><i class="fas fa-music"></i></div><span>Music</span></div>
        <div class="app-icon" onclick="openApp('games')"><div class="icon-box bg-games"><i class="fas fa-gamepad"></i></div><span>Games</span></div>
        <div class="app-icon" onclick="openApp('ai')"><div class="icon-box bg-ai"><i class="fas fa-robot"></i></div><span>AI Chat</span></div>
        <div class="app-icon" onclick="openApp('settings')"><div class="icon-box bg-settings"><i class="fas fa-cog"></i></div><span>Settings</span></div>

        <!-- TikTok App (Custom) -->
        <div class="window" id="window-tiktok">
            <div class="window-header"><span>TikTok</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('tiktok')"></button><button class="win-btn btn-red" onclick="closeApp('tiktok')"></button></div></div>
            <div class="window-content app-layout">
                <div class="app-search-bar">
                    <input type="text" id="tiktok-search" placeholder="Search user..." onkeypress="if(event.key === 'Enter') searchTikTok()">
                    <button style="background:#25f4ee; color:black;" onclick="searchTikTok()">Search</button>
                </div>
                <div class="video-grid" id="tiktok-grid"></div>
                <div class="video-player-overlay" id="tiktok-player">
                    <div class="close-player" onclick="closeTikTokPlayer()">Close Video</div>
                    <iframe id="tiktok-iframe" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- YouTube App (Custom Search, Unblocked) -->
        <div class="window" id="window-youtube">
            <div class="window-header"><span>YouTube</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('youtube')"></button><button class="win-btn btn-red" onclick="closeApp('youtube')"></button></div></div>
            <div class="window-content app-layout">
                <div class="app-search-bar">
                    <input type="text" id="youtube-search" placeholder="Search YouTube..." onkeypress="if(event.key === 'Enter') searchYouTube()">
                    <button onclick="searchYouTube()">Search</button>
                </div>
                <div class="video-grid" id="youtube-grid"></div>
                <div class="video-player-overlay" id="youtube-player">
                    <div class="close-player" onclick="closeYouTubePlayer()">Close Video</div>
                    <iframe id="youtube-iframe" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- Movies App -->
        <div class="window" id="window-movies">
            <div class="window-header"><span>Movies</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('movies')"></button><button class="win-btn btn-red" onclick="closeApp('movies')"></button></div></div>
            <div class="window-content"><iframe id="iframe-movies" src="https://multiembed.mov/?video_id=155&tmdb=1" allow="autoplay; fullscreen"></iframe></div>
        </div>

        <!-- Music App -->
        <div class="window" id="window-music">
            <div class="window-header"><span>Music</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('music')"></button><button class="win-btn btn-red" onclick="closeApp('music')"></button></div></div>
            <div class="window-content music-app">
                <div class="music-header"><input type="text" id="music-search" placeholder="Search songs..." onkeypress="if(event.key === 'Enter') searchMusic()"><button onclick="searchMusic()">Search</button></div>
                <div class="music-grid" id="music-grid"></div>
                <audio id="music-audio" controls style="width:100%; margin-top:20px; display:none;"></audio>
            </div>
        </div>

        <!-- Games App -->
        <div class="window" id="window-games">
            <div class="window-header"><span>Games</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('games')"></button><button class="win-btn btn-red" onclick="closeApp('games')"></button></div></div>
            <div class="window-content games-app">
                <div class="games-grid">
                    <div class="game-card" onclick="playGame('https://www.crazygames.com/embed/retro-bowl')"><img src="https://imgs.crazygames.com/retro-bowl_16x9/20220106142828/retro-bowl_16x9-cover"><p>Retro Bowl</p></div>
                    <div class="game-card" onclick="playGame('https://www.crazygames.com/embed/slope')"><img src="https://imgs.crazygames.com/slope_16x9/20210804113951/slope_16x9-cover"><p>Slope</p></div>
                    <div class="game-card" onclick="playGame('https://www.crazygames.com/embed/tunnel-rush')"><img src="https://imgs.crazygames.com/tunnel-rush_16x9/20210212082734/tunnel-rush_16x9-cover"><p>Tunnel Rush</p></div>
                </div>
            </div>
        </div>

        <!-- AI Chat -->
        <div class="window" id="window-ai">
            <div class="window-header"><span>Ghost AI</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('ai')"></button><button class="win-btn btn-red" onclick="closeApp('ai')"></button></div></div>
            <div class="window-content ai-app">
                <div class="ai-messages" id="ai-messages"><div class="msg bot">Hello! I am Ghost AI.</div></div>
                <div class="ai-input"><input type="text" id="ai-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendAI()"><button onclick="sendAI()">Send</button></div>
            </div>
        </div>

        <!-- Settings -->
        <div class="window" id="window-settings">
            <div class="window-header"><span>Settings</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('settings')"></button><button class="win-btn btn-red" onclick="closeApp('settings')"></button></div></div>
            <div class="window-content settings-app">
                <h2>Wallpaper</h2>
                <div class="bg-options">
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500');" onclick="setBG('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000')"></div>
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=500');" onclick="setBG('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2000')"></div>
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1533130061792-64b345e4a833?q=80&w=500');" onclick="setBG('https://images.unsplash.com/photo-1533130061792-64b345e4a833?q=80&w=2000')"></div>
                </div>
                <h2>Custom Wallpaper</h2>
                <p style="margin-bottom: 10px; color: #aaa; font-size: 13px;">Upload an image from your Chromebook.</p>
                <input type="file" id="bg-upload" class="upload-btn" accept="image/*" onchange="uploadBG(event)">
            </div>
        </div>

        <!-- Game Player Modal -->
        <div class="window" id="window-game-player" style="width: 80%; height: 80%; left: 10%; top: 10%;">
            <div class="window-header"><span id="game-title">Game</span><div class="window-controls"><button class="win-btn btn-green" onclick="fullscreen('game-iframe')"></button><button class="win-btn btn-red" onclick="closeApp('game-player')"></button></div></div>
            <div class="window-content"><iframe id="game-iframe" src="" allowfullscreen></iframe></div>
        </div>

    </div>

    <div class="dock">
        <div class="dock-icon bg-tiktok" onclick="openApp('tiktok')"><i class="fab fa-tiktok"></i></div>
        <div class="dock-icon bg-youtube" onclick="openApp('youtube')"><i class="fab fa-youtube"></i></div>
        <div class="dock-icon bg-music" onclick="openApp('music')"><i class="fas fa-music"></i></div>
        <div class="dock-icon bg-games" onclick="openApp('games')"><i class="fas fa-gamepad"></i></div>
        <div class="dock-icon bg-ai" onclick="openApp('ai')"><i class="fas fa-robot"></i></div>
        <div class="dock-icon bg-settings" onclick="openApp('settings')"><i class="fas fa-cog"></i></div>
    </div>

    <script>
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);

        function openApp(appName) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            document.getElementById(`window-${appName}`).classList.add('active');
        }

        function closeApp(appName) {
            document.getElementById(`window-${appName}`).classList.remove('active');
            if(appName === 'music') document.getElementById('music-audio').pause();
            if(appName === 'game-player') document.getElementById('game-iframe').src = '';
        }

        function fullscreen(id) {
            const element = document.getElementById(`iframe-${id}`) || document.getElementById(`window-${id}`);
            if (element.requestFullscreen) { element.requestFullscreen(); } 
            else if (element.webkitRequestFullscreen) { element.webkitRequestFullscreen(); }
        }

        function setBG(url) { document.body.style.backgroundImage = `url('${url}')`; }

        function uploadBG(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => { setBG(e.target.result); };
                reader.readAsDataURL(file);
            }
        }

        function playGame(url) {
            document.getElementById('game-iframe').src = url;
            document.getElementById('game-title').innerText = "Playing Game...";
            openApp('game-player');
        }

        // --- TIKTOK APP (API) ---
        async function searchTikTok() {
            const q = document.getElementById('tiktok-search').value;
            if(!q) return;
            const grid = document.getElementById('tiktok-grid');
            grid.innerHTML = '<div style="color:white;">Searching...</div>';
            try {
                const res = await fetch(`https://www.tikwm.com/api/user/posts?unique_id=${q}&count=12`);
                const data = await res.json();
                grid.innerHTML = '';
                if(data.code === 0 && data.data && data.data.videos) {
                    data.data.videos.forEach(v => {
                        const div = document.createElement('div');
                        div.className = 'video-card';
                        div.innerHTML = `<img src="${v.cover}"><h4>@${v.author.unique_id}</h4>`;
                        div.onclick = () => {
                            document.getElementById('tiktok-iframe').src = `https://www.tiktok.com/embed/v2/${v.id}`;
                            document.getElementById('tiktok-player').classList.add('active');
                        };
                        grid.appendChild(div);
                    });
                } else {
                    grid.innerHTML = '<div style="color:white;">User not found.</div>';
                }
            } catch(e) { grid.innerHTML = '<div style="color:red;">API Blocked.</div>'; }
        }
        function closeTikTokPlayer() {
            document.getElementById('tiktok-player').classList.remove('active');
            document.getElementById('tiktok-iframe').src = "";
        }

        // --- YOUTUBE APP (API) ---
        async function searchYouTube() {
            const q = document.getElementById('youtube-search').value;
            if(!q) return;
            const grid = document.getElementById('youtube-grid');
            grid.innerHTML = '<div style="color:white;">Searching...</div>';
            try {
                const res = await fetch(`https://inv.nadeko.net/api/v1/search?q=${q}&type=video`);
                const data = await res.json();
                grid.innerHTML = '';
                data.slice(0, 12).forEach(v => {
                    if(!v.videoId) return;
                    const div = document.createElement('div');
                    div.className = 'video-card';
                    div.innerHTML = `<img src="${v.videoThumbnails[0].url}"><h4>${v.title}</h4>`;
                    div.onclick = () => {
                        document.getElementById('youtube-iframe').src = `https://www.youtube.com/embed/${v.videoId}?autoplay=1`;
                        document.getElementById('youtube-player').classList.add('active');
                    };
                    grid.appendChild(div);
                });
            } catch(e) { grid.innerHTML = '<div style="color:red;">API Blocked.</div>'; }
        }
        function closeYouTubePlayer() {
            document.getElementById('youtube-player').classList.remove('active');
            document.getElementById('youtube-iframe').src = "";
        }

        // --- MUSIC APP ---
        async function searchMusic() {
            const q = document.getElementById('music-search').value;
            if(!q) return;
            const grid = document.getElementById('music-grid');
            grid.innerHTML = '<div style="color:white;">Searching...</div>';
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=18`);
                const data = await res.json();
                grid.innerHTML = '';
                data.results.forEach(i => {
                    const div = document.createElement('div');
                    div.className = 'music-card';
                    div.innerHTML = `<img src="${i.artworkUrl100.replace('100x100', '300x300')}"><h4>${i.trackName}</h4><p>${i.artistName}</p>`;
                    div.onclick = () => {
                        const audio = document.getElementById('music-audio');
                        audio.src = i.previewUrl;
                        audio.style.display = 'block';
                        audio.play();
                    };
                    grid.appendChild(div);
                });
            } catch(e) { grid.innerHTML = '<div style="color:red;">API Blocked.</div>'; }
        }

        // --- AI CHAT ---
        async function sendAI() {
            const input = document.getElementById('ai-input').value;
            if(!input) return;
            const chat = document.getElementById('ai-messages');
            chat.innerHTML += `<div class="msg user">${input}</div>`;
            document.getElementById('ai-input').value = '';
            chat.scrollTop = chat.scrollHeight;
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(input)}`);
                const text = await res.text();
                chat.innerHTML += `<div class="msg bot">${text}</div>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (e) { chat.innerHTML += `<div class="msg bot">Connection error.</div>`; }
        }
    </script>
</body>
</html>
