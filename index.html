<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }

        :root {
            --red-main: #ff0033;
            --red-glow: rgba(255, 0, 51, 0.5);
            --dark-bg: #0a0000;
            --glass: rgba(20, 5, 5, 0.6);
            --glass-border: rgba(255, 0, 51, 0.2);
        }

        body {
            height: 100vh; width: 100vw; overflow: hidden;
            /* Cool moving red/black gradient background */
            background: linear-gradient(135deg, #000000 0%, #2a0005 50%, #0a0000 100%);
            background-size: 400% 400%;
            animation: bgAnim 15s ease infinite;
            color: white;
        }

        @keyframes bgAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Bar */
        .top-bar {
            height: 40px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--glass-border);
            position: absolute; top: 0; width: 100%; z-index: 10;
        }
        .top-left { display: flex; gap: 20px; color: #aaa; }
        .top-right { display: flex; gap: 15px; align-items: center; }
        .clock { color: white; font-weight: 800; }

        /* Welcome Text */
        .welcome-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 1; pointer-events: none;
        }
        .welcome-title {
            font-size: 100px; font-weight: 900; letter-spacing: -2px;
            color: transparent; -webkit-text-stroke: 2px var(--red-main);
            text-shadow: 0 0 30px var(--red-glow); margin-bottom: 10px;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 20px var(--red-glow); opacity: 0.8; }
            100% { text-shadow: 0 0 50px var(--red-main); opacity: 1; }
        }

        /* App Grid */
        .app-grid {
            position: absolute; top: 60px; left: 40px; z-index: 10;
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 30px;
        }

        .app-icon {
            width: 80px; height: 80px; border-radius: 20px;
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s ease; text-decoration: none; color: white;
        }

        .app-icon:hover {
            transform: scale(1.1) translateY(-5px);
            border-color: var(--red-main); box-shadow: 0 10px 20px var(--red-glow);
        }

        .app-icon span { font-size: 32px; margin-bottom: 5px; }
        .app-label { font-size: 12px; font-weight: 600; text-align: center; text-shadow: 0 2px 4px black; }

        /* Dock at bottom */
        .dock {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 0, 0, 0.7); backdrop-filter: blur(20px);
            padding: 15px 25px; border-radius: 30px; display: flex; gap: 20px;
            border: 1px solid var(--glass-border); z-index: 10;
        }

        .dock-icon {
            width: 50px; height: 50px; border-radius: 15px; background: #222;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            cursor: pointer; transition: 0.2s;
        }
        .dock-icon:hover { background: var(--red-main); box-shadow: 0 0 20px var(--red-glow); }

        /* Full Screen Overlays (For Apps) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050000; z-index: 1000; display: none; flex-direction: column;
            animation: slideUp 0.3s ease forwards;
        }
        .overlay.active { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .overlay-header {
            height: 50px; background: #111; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; border-bottom: 1px solid #333;
        }
        .overlay-title { font-weight: 800; color: var(--red-main); }
        .close-btn {
            background: var(--red-main); color: white; border: none; padding: 8px 15px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .close-btn:hover { background: #cc0029; }

        /* IDE specific styles */
        .ide-container { display: flex; flex: 1; width: 100%; height: calc(100vh - 50px); }
        .ide-code {
            width: 50%; height: 100%; background: #1e1e1e; color: #00ffcc;
            padding: 20px; font-family: monospace; font-size: 14px; outline: none; border: none; resize: none;
        }
        .ide-preview {
            width: 50%; height: 100%; background: white; border: none;
        }

        /* Settings Modal */
        #settings-modal { position: absolute; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        #settings-modal.active { display: flex; }
        .settings-box { background: #111; padding: 30px; border-radius: 16px; border: 1px solid var(--red-main); width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .settings-box input { padding: 12px; border-radius: 8px; background: #000; color: white; border: 1px solid #333; outline: none; }
        .settings-box button { padding: 12px; background: var(--red-main); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }

    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span>VEX OS</span>
            <span>Finder</span>
        </div>
        <div class="top-right">
            <span>🎵 Now Listening</span>
            <span class="clock" id="clock">00:00 PM</span>
        </div>
    </div>

    <!-- Welcome Background Text -->
    <div class="welcome-container">
        <div class="welcome-title">WELCOME TO VEX</div>
    </div>

    <!-- App Grid -->
    <div class="app-grid">
        <div class="app-icon" onclick="openOverlay('code-ide')">
            <span>💻</span><span class="app-label">Code IDE</span>
        </div>
        <div class="app-icon" onclick="openApp('https://www.tiktok.com')">
            <span>🎵</span><span class="app-label">TikTok</span>
        </div>
        <div class="app-icon" onclick="openApp('https://www.roblox.com')">
            <span>🟥</span><span class="app-label">Roblox</span>
        </div>
        <div class="app-icon" onclick="openApp('https://www.youtube.com')">
            <span>▶️</span><span class="app-label">YouTube</span>
        </div>
        <div class="app-icon" onclick="openApp('https://chatgpt.com')">
            <span>🤖</span><span class="app-label">AI Chat</span>
        </div>
        <div class="app-icon" onclick="openApp('https://discord.com')">
            <span>👾</span><span class="app-label">Discord</span>
        </div>
        <div class="app-icon" onclick="openOverlay('terminal')">
            <span>⌨️</span><span class="app-label">Terminal</span>
        </div>
        <div class="app-icon" onclick="openOverlay('notes')">
            <span>📝</span><span class="app-label">Notes</span>
        </div>
    </div>

    <!-- Dock -->
    <div class="dock">
        <div class="dock-icon" onclick="location.reload()">🌐</div>
        <div class="dock-icon" onclick="openApp('https://google.com')">🔍</div>
        <div class="dock-icon" onclick="openApp('https://web.roblox.com')">🎮</div>
        <div class="dock-icon" onclick="openSettings()">⚙️</div>
    </div>

    <!-- IDE Overlay -->
    <div id="code-ide" class="overlay">
        <div class="overlay-header">
            <div class="overlay-title">Live Code IDE</div>
            <button class="close-btn" onclick="closeOverlay('code-ide')">Close</button>
        </div>
        <div class="ide-container">
            <textarea class="ide-code" id="html-code" placeholder="<h1>Hello World</h1>"><h1>Hello VEX</h1>
<style>h1 { color: red; }</style></textarea>
            <iframe class="ide-preview" id="html-preview"></iframe>
        </div>
    </div>

    <!-- Terminal Overlay -->
    <div id="terminal" class="overlay">
        <div class="overlay-header">
            <div class="overlay-title">VEX Terminal</div>
            <button class="close-btn" onclick="closeOverlay('terminal')">Close</button>
        </div>
        <div style="flex:1; background:black; color:#00ffcc; font-family:monospace; padding:20px; font-size:16px;">
            <p>VEX OS [Version 1.0.0]</p>
            <p>(c) VEX Corporation. All rights reserved.</p>
            <br>
            <p>C:\Users\VEX> <span id="cursor" style="animation: blink 1s infinite;">_</span></p>
        </div>
    </div>

    <!-- Notes Overlay -->
    <div id="notes" class="overlay">
        <div class="overlay-header">
            <div class="overlay-title">Notes</div>
            <button class="close-btn" onclick="closeOverlay('notes')">Close</button>
        </div>
        <textarea style="flex:1; background:#1a1a1a; color:white; padding:20px; font-size:18px; border:none; outline:none; resize:none;" placeholder="Type your notes here..."></textarea>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="settings-box">
            <h2 style="color:#ff0033; text-align:center;">Settings</h2>
            <label>Change Background GIF/Image URL:</label>
            <input type="text" id="bg-url" placeholder="https://example.com/gif.gif">
            <label>Set Passcode:</label>
            <input type="password" placeholder="Enter new passcode">
            <button onclick="saveSettings()">Save & Close</button>
            <button onclick="document.getElementById('settings-modal').classList.remove('active')" style="background:#333;">Cancel</button>
        </div>
    </div>

    <script>
        // --- Clock ---
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes().toString().padStart(2, '0');
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Overlay Logic ---
        function openOverlay(id) {
            document.getElementById(id).classList.add('active');
            if (id === 'code-ide') {
                updatePreview();
            }
        }
        function closeOverlay(id) {
            document.getElementById(id).classList.remove('active');
        }

        // --- Live Code IDE Logic ---
        const codeEditor = document.getElementById('html-code');
        const preview = document.getElementById('html-preview');

        codeEditor.addEventListener('input', updatePreview);

        function updatePreview() {
            const html = codeEditor.value;
            preview.srcdoc = html;
        }

        // --- External App Link ---
        function openApp(url) {
            // Opens in a new tab. If we are in a proxy, this will route through the proxy.
            window.open(url, '_blank');
        }

        // --- Settings Logic ---
        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
        }

        function saveSettings() {
            const bgUrl = document.getElementById('bg-url').value;
            if (bgUrl) {
                document.body.style.backgroundImage = `url('${bgUrl}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.animation = 'none'; // Stop the gradient animation
            }
            document.getElementById('settings-modal').classList.remove('active');
        }

        // Initialize Preview
        updatePreview();
    </script>
</body>
</html>
