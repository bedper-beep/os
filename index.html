<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostOS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.5s; }
        
        /* Top Bar */
        .top-bar { height: 30px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; font-size: 13px; font-weight: 600; z-index: 1000; }
        
        /* Desktop Icons */
        .desktop { flex: 1; position: relative; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; flex-wrap: wrap; height: calc(100vh - 120px); align-content: flex-start;}
        .icon { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; cursor: pointer; padding: 10px; border-radius: 8px; transition: 0.2s; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .icon:hover { background: rgba(255,255,255,0.2); }
        .icon i { font-size: 40px; margin-bottom: 8px; }
        .icon span { font-size: 12px; font-weight: 600; text-align: center; }
        
        /* Windows */
        .window { position: absolute; top: 5%; left: 10%; width: 80%; height: 85%; background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; display: none; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .window.active { display: flex; }
        .window-header { height: 40px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .window-controls { display: flex; gap: 10px; }
        .win-btn { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: none; display: flex; justify-content: center; align-items: center; }
        .btn-red { background: #ff5f56; }
        .btn-green { background: #27c93f; }
        .window-content { flex: 1; background: #000; position: relative; }
        .window-content iframe { width: 100%; height: 100%; border: none; }

        /* Custom Music UI */
        .music-app { display: flex; flex-direction: column; height: 100%; background: #121212; padding: 20px; overflow-y: auto; }
        .music-header { display: flex; gap: 10px; margin-bottom: 20px; }
        .music-header input { flex: 1; padding: 12px; border-radius: 30px; border: none; background: #2a2a2a; color: white; outline: none; }
        .music-header button { padding: 12px 25px; border-radius: 30px; border: none; background: #1db954; color: black; font-weight: bold; cursor: pointer; }
        .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .music-card { background: #181818; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .music-card:hover { background: #282828; }
        .music-card img { width: 100%; aspect-ratio: 1; border-radius: 5px; margin-bottom: 10px; }
        .music-card h4 { font-size: 14px; color: white; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-card p { font-size: 12px; color: #b3b3b3; }

        /* Settings UI */
        .settings-app { padding: 30px; background: #121212; height: 100%; color: white; }
        .settings-app h2 { margin-bottom: 20px; }
        .bg-options { display: flex; gap: 20px; flex-wrap: wrap; }
        .bg-opt { width: 150px; height: 90px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; background-size: cover; background-position: center; }
        .bg-opt:hover { border-color: white; }

        /* Dock */
        .dock { height: 70px; background: rgba(20,20,25,0.8); backdrop-filter: blur(20px); margin: 0 auto 15px auto; border-radius: 20px; display: flex; align-items: center; padding: 0 20px; gap: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .dock-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; cursor: pointer; transition: 0.2s; }
        .dock-icon:hover { transform: scale(1.2) translateY(-5px); }
        .dock-icon.tiktok { background: #000; border: 1px solid #25f4ee; }
        .dock-icon.youtube { background: #ff0000; }
        .dock-icon.music { background: #1db954; }
        .dock-icon.movies { background: #ff9900; }
        .dock-icon.search { background: #0078D7; }
        .dock-icon.settings { background: #555; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>👻 GhostOS</div>
        <div id="clock">12:00 PM</div>
    </div>

    <div class="desktop">
        <div class="icon" onclick="openApp('search')"><i class="fas fa-search"></i><span>Search</span></div>
        <div class="icon" onclick="openApp('tiktok')"><i class="fab fa-tiktok"></i><span>TikTok</span></div>
        <div class="icon" onclick="openApp('youtube')"><i class="fab fa-youtube" style="color: #ff0000;"></i><span>YouTube</span></div>
        <div class="icon" onclick="openApp('movies')"><i class="fas fa-film" style="color: #ff9900;"></i><span>Movies</span></div>
        <div class="icon" onclick="openApp('music')"><i class="fas fa-music" style="color: #1db954;"></i><span>Music</span></div>
        <div class="icon" onclick="openApp('settings')"><i class="fas fa-cog"></i><span>Settings</span></div>

        <!-- Search Window -->
        <div class="window" id="window-search">
            <div class="window-header"><span>Ghost Search (No History)</span><button class="win-btn btn-red" onclick="closeApp('search')"></button></div>
            <div class="window-content"><iframe src="https://lite.duckduckgo.com/lite/" allowfullscreen></iframe></div>
        </div>

        <!-- YouTube Window (With Fullscreen) -->
        <div class="window" id="window-youtube">
            <div class="window-header">
                <span>YouTube Pro</span>
                <div class="window-controls">
                    <button class="win-btn btn-green" onclick="fullscreen('youtube')"><i class="fas fa-expand" style="font-size:10px; color:black;"></i></button>
                    <button class="win-btn btn-red" onclick="closeApp('youtube')"></button>
                </div>
            </div>
            <div class="window-content">
                <iframe id="iframe-youtube" src="https://inv.nadeko.net/" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <!-- TikTok Window -->
        <div class="window" id="window-tiktok">
            <div class="window-header">
                <span>TikTok Proxied</span>
                <button class="win-btn btn-red" onclick="closeApp('tiktok')"></button>
            </div>
            <div class="window-content">
                <iframe src="https://corsproxy.io/?https://www.tiktok.com/embed" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <!-- Movies Window -->
        <div class="window" id="window-movies">
            <div class="window-header">
                <span>Movies (MultiEmbed)</span>
                <button class="win-btn btn-red" onclick="closeApp('movies')"></button>
            </div>
            <div class="window-content">
                <iframe src="https://multiembed.mov/?video_id=299534&tmdb=1" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <!-- Music Window (Custom) -->
        <div class="window" id="window-music">
            <div class="window-header">
                <span>Spotify Pro</span>
                <button class="win-btn btn-red" onclick="closeApp('music')"></button>
            </div>
            <div class="window-content music-app">
                <div class="music-header">
                    <input type="text" id="music-search" placeholder="Search songs, artists..." onkeypress="if(event.key === 'Enter') searchMusic()">
                    <button onclick="searchMusic()">Search</button>
                </div>
                <div class="music-grid" id="music-grid"></div>
                <audio id="music-audio" controls style="width:100%; margin-top:20px; display:none;"></audio>
            </div>
        </div>

        <!-- Settings Window -->
        <div class="window" id="window-settings">
            <div class="window-header">
                <span>Settings</span>
                <button class="win-btn btn-red" onclick="closeApp('settings')"></button>
            </div>
            <div class="window-content settings-app">
                <h2>Change Wallpaper</h2>
                <div class="bg-options">
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500');" onclick="setBG('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000')"></div>
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=500');" onclick="setBG('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2000')"></div>
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1533130061792-64b345e4a833?q=80&w=500');" onclick="setBG('https://images.unsplash.com/photo-1533130061792-64b345e4a833?q=80&w=2000')"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Dock -->
    <div class="dock">
        <div class="dock-icon search" onclick="openApp('search')"><i class="fas fa-search"></i></div>
        <div class="dock-icon tiktok" onclick="openApp('tiktok')"><i class="fab fa-tiktok"></i></div>
        <div class="dock-icon youtube" onclick="openApp('youtube')"><i class="fab fa-youtube"></i></div>
        <div class="dock-icon movies" onclick="openApp('movies')"><i class="fas fa-film"></i></div>
        <div class="dock-icon music" onclick="openApp('music')"><i class="fas fa-music"></i></div>
        <div class="dock-icon settings" onclick="openApp('settings')"><i class="fas fa-cog"></i></div>
    </div>

    <script>
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function openApp(appName) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            document.getElementById(`window-${appName}`).classList.add('active');
        }

        function closeApp(appName) {
            document.getElementById(`window-${appName}`).classList.remove('active');
            if(appName === 'music') document.getElementById('music-audio').pause();
        }

        // Fullscreen Function for the Green Button
        function fullscreen(appName) {
            const iframe = document.getElementById(`iframe-${appName}`);
            if (iframe.requestFullscreen) { iframe.requestFullscreen(); } 
            else if (iframe.webkitRequestFullscreen) { iframe.webkitRequestFullscreen(); }
        }

        // Change Background
        function setBG(url) { document.body.style.backgroundImage = `url('${url}')`; }

        // Custom Music Logic
        async function searchMusic() {
            const q = document.getElementById('music-search').value;
            if(!q) return;
            const grid = document.getElementById('music-grid');
            grid.innerHTML = '<div style="color:white;">Searching...</div>';
            
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=18`);
                const data = await res.json();
                grid.innerHTML = '';
                
                data.results.forEach(i => {
                    const div = document.createElement('div');
                    div.className = 'music-card';
                    div.innerHTML = `
                        <img src="${i.artworkUrl100.replace('100x100', '300x300')}">
                        <h4>${i.trackName}</h4>
                        <p>${i.artistName}</p>
                    `;
                    div.onclick = () => {
                        const audio = document.getElementById('music-audio');
                        audio.src = i.previewUrl;
                        audio.style.display = 'block';
                        audio.play();
                    };
                    grid.appendChild(div);
                });
            } catch(e) { grid.innerHTML = '<div style="color:red;">API Blocked.</div>'; }
        }
    </script>
</body>
</html>
